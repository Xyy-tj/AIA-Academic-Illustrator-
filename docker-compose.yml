services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: aia_db
      MYSQL_USER: aia_user
      MYSQL_PASSWORD: aia_password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend/logs:/app/logs
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      - SECRET_KEY=super-secret-key-for-dev-only-change-me-in-prod
      - DATABASE_URL=mysql+pymysql://aia_user:aia_password@db:3306/aia_db
      # - OPENAI_API_KEY=... # If you want to support env vars for API keys in future

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: always

volumes:
  db_data:
